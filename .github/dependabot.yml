version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8 só suporta TypeScript < 6.1. Remover quando houver suporte ao TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      producao:
        dependency-type: production
      desenvolvimento:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
